# PHP over CGI or FastCGI without FPM: observation only.
#
# php-cgi started as a FastCGI daemon (php-cgi -b, spawn-fcgi, a supervisor) is its own process tree:
# watch php-cgi (php-cgi8.4 on Debian). With Apache mod_fcgid on Debian the FastCGI wrapper is
# /usr/lib/cgi-bin/php8.4 and its executable name is php8.4, not php-cgi: watch apache2 (the wrapper is a
# descendant) or php8.4 (which also selects the PHP CLI). Look at the real executable first:
#   readlink /proc/$(pgrep -o -f php-cgi)/exe
config_version: 1
watch:
  image_contains: ["php-cgi"]

capture:
  argv: true
  argv_max_bytes: 16383
  argv_max_args: 64

outputs:
  file:
    path: /var/log/process-watcher/events.jsonl
