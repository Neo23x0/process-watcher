# PHP-FPM: terminate shells and interpreters that a PHP worker starts. A REACTION AFTER DETECTION, not a block.
#
# Read first:
#  - The signal is sent after the agent has seen the exec. A short-lived program (a shell running one
#    quick command lives about half a millisecond) may be finished, with its effects, before the signal
#    arrives. Long-running ones (a reverse shell, a download, a miner) are reached within about a
#    millisecond. "signal_sent" means the kernel accepted the signal; the process.exit event with
#    signal 9 confirms the death.
#  - Many PHP applications start shells on purpose. Run php-fpm-dry-run.yaml in production first.
#  - Never use a broad rule such as the substring "php" together with the watch pattern php-fpm: the
#    workers run the same executable and would be killed as they are forked. check-config and
#    agent.started warn about that; spare_root_image: true prevents it.
#  - Code that runs entirely inside a worker (no fork, no exec) is invisible to these rules, and a root
#    (the php-fpm master) is never a target.
#  - The netcat and socat family are symlinks or alternatives on most distributions: verified with the
#    real agent against Debian 13 (nc -> nc.openbsd, socat -> socat1, telnet -> inetutils-telnet) and by
#    executable path against Rocky 9 (nc -> ncat, socat and telnet unversioned). See docs/php.md.
config_version: 1
watch:
  image_contains: ["php-fpm"]

capture:
  argv: true
  argv_max_bytes: 16383
  argv_max_args: 64

kill:
  enabled: true
  dry_run: false
  fields: ["image"]
  regex:
    - '^(sh|dash|bash|zsh|ksh|ash)$'
    - '^python[0-9.]*$'
    - '^(perl|ruby[0-9.]*)$'
    - '^(nc|nc\.openbsd|nc\.traditional|ncat|socat[0-9]*|telnet|inetutils-telnet)$'
    - '^php[0-9.]*$'
  spare_root_image: true

outputs:
  file:
    path: /var/log/process-watcher/events.jsonl
