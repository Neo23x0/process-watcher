# PHP CLI: queue workers, scheduled jobs, long-running scripts started by cron, systemd or a supervisor.
#
# Every php process started this way is a root of its own, so it is observed and never a kill target. What
# it starts is a descendant. On Debian and Ubuntu the interpreter is php8.4 (the php command is a link to
# it); "php8." selects the versioned CLI binaries (and the versioned CGI wrapper) but not php-fpm8.4 or
# php-cgi8.4. On images with an unversioned /usr/local/bin/php use "php": that substring also selects
# php-fpm and php-cgi, so add exclusions or watch the service separately.
config_version: 1
watch:
  image_contains: ["php8."]

capture:
  argv: true                  # php /srv/app/artisan queue:work, php -r '...'
  argv_max_bytes: 16383
  argv_max_args: 64

outputs:
  file:
    path: /var/log/process-watcher/events.jsonl
