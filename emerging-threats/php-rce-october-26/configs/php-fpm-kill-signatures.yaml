# PHP-FPM response rules: the image-identity rules below plus a second layer of command-line signatures that
# you can extend with your own. It ships as a dry run: read the guide first
# (emerging-threats/php-rce-october-26/guide.md, section 6).
#
# The rules below (image identity) already cover every reverse or bind shell written in these
# interpreters, no matter what its source code says: such a shell has to execute as one of these
# programs. Matching a specific command line in addition can still be useful as a second, independent
# layer, for example against a known, unmodified payload. The patterns further below are such a layer,
# kept apart from the image-identity rules above; keep in mind:
#
#  - they are brittle by construction: renaming a variable, changing the encoding, or adding a layer of
#    eval or base64 defeats a literal or near-literal match. This layer catches reuse, not adaptation.
#  - argv matching only ever sees what reaches the executed program as an argument. Code read from stdin,
#    a file, an environment variable or assembled at runtime inside the interpreter never appears here
#    (the same blind spot as the rest of the kill feature, see emerging-threats/php-rce-october-26/guide.md section 5).
#  - a cut argument can never match (docs/kill-rules.md, "Validation"): keep your patterns well inside
#    capture.argv_max_bytes, and know that a payload longer than the limit silently stops matching.
#  - every rule is OR-combined with every other rule and reported together (docs/kill-rules.md,
#    "Matching"): a bad pattern only adds false positives or false negatives of its own, it does not
#    weaken the image-identity rules above it.
#
# Add your own patterns to the regex list below alongside the shipped ones. Each one is a
# Go RE2 regular expression tested against one argument at a time (field: argv), unanchored by default:
# anchor with ^ and $ for the whole argument. Validate the YAML and every regex with:
#
#   process-watcher check-config --config php/php-fpm-kill-signatures.yaml
#
# then run with kill.dry_run: true (the default below) and review response.kill_requested /
# response.kill_result in your own traffic before ever switching to dry_run: false.
#
# --kill-dry-run=false ends the dry run. To run only the image-identity rules, add --kill-field image: the
# signature entries are then compared with the executable's file name only.
config_version: 1
watch:
  image_contains: ["php-fpm"]

capture:
  argv: true
  argv_max_bytes: 16383
  argv_max_args: 64

kill:
  enabled: true
  dry_run: true                # flip to false only after reviewing hits in your own traffic
  fields: ["image", "argv"]
  regex:
    # --- Image identity (names verified on Debian 13 and Rocky 9; guide section 6) ---
    - '^(sh|dash|bash|zsh|ksh|ash)$'
    - '^python[0-9.]*$'
    - '^(perl|ruby[0-9.]*)$'
    - '^(nc|nc\.openbsd|nc\.traditional|ncat|socat[0-9]*|telnet|inetutils-telnet)$'
    - '^php[0-9.]*$'

    # --- BASH reverse shells (/dev/tcp & /dev/udp fd-redirect shapes) ---
    - '/dev/(tcp|udp)/[^ /]+/[0-9]{2,5}'                      # bash -i, 196, read-line, 5, udp — all 5 variants
    - 'exec\s+[0-9]+<>/dev/(tcp|udp)/'                        # exec-fd form: exec 196<>/dev/tcp/…
    - '>&\s*/dev/udp/'                                        # UDP redirect form

    # --- PYTHON reverse shells (dup2 + pty.spawn one-liners) ---
    - 'dup2\([a-zA-Z0-9_]+\.fileno\(\),\s*[012]\)'            # os.dup2(s.fileno(),0/1/2) — lowest-FP single marker
    - 'pty\.spawn\('
    - 'python[0-9.]*\s+-c\s+[''"]import\s+(socket|os|pty|subprocess)'   # python -c 'import socket…' one-liners
    - 'os\.getenv\("RHOST"\)'                                 # env-indirection variant
    - 'def\s+(s2p|p2s)\('                                     # Windows relay-thread variant

    # --- PYTHON bind shells ---
    - '\.listen\([0-9]+\).{0,120}\.accept\(\)'               # bind+listen then accept (Python3 Bind)

    # --- PERL reverse & bind shells (Socket / IO::Socket families; sockaddr_in covers both directions) ---
    - 'sockaddr_in\('                                         # connect(S,sockaddr_in( & bind(S,sockaddr_in(
    - 'open\(STD(IN|OUT|ERR),">&'                             # STDIN/STDOUT/STDERR reopen onto socket
    - 'IO::Socket::INET'                                      # perl -MIO family
    - '->fdopen\('                                            # STDIN->fdopen($c,r)
    - 'inet_aton\('                                           # address resolution one-liners

    # --- PHP reverse shells (fsockopen + fd-3 redirect carousel) ---
    - 'fsockopen\('                                           # every php -r revshell starts here
    - '<&3\s+>&3\s+2>&3'                                      # the fixed fd-3 chain — near-zero FP
    - '\b(shell_exec|passthru|proc_open)\b'                   # exec-function carousel + Ivan Sincek descriptorspec
    - 'php[0-9.]*\s+-r\s+[''"]\$[a-z]'                        # php -r '$sock=…' one-liner shape

    # --- PHP bind shells ---
    - 'socket_(bind|listen|accept)\('                         # PHP Bind socket_create family

    # --- PHP webshells (argv-visible superglobal + exec combos) ---
    - '\$_(GET|POST|REQUEST)\['                               # $_GET[cmd] /`$_GET[0]` — in argv = passed on CLI

    # --- TRANSPORT-layer one-liners (nc/ncat/socat/openssl/mkfifo pipes, single-arg sh -c form) ---
    - '\b(nc|ncat)(\.exe)?\s[^;|]{0,60}-[ec]\s'               # nc/ncat -e/-c with any flag order
    - 'busybox\s+nc\s+[^;]*\s-e\s'                            # BusyBox nc -e
    - 'mkfifo\s+[^ ]+.{0,120}\|[^|]*(sh|bash|nc|ncat|telnet|openssl)'  # mkfifo relay pipes
    - 'socat\s+TCP(-LISTEN)?:[^ ]+\s+EXEC:'                   # socat TCP*: EXEC: (rev + bind)
    - 'socat\s+TCP(-LISTEN)?:'                                # broader socat TCP shape
    - 'openssl\s+s_client\s+-quiet\s+-connect.{0,60}(mkfifo|>|sh\b)'   # openssl stager with shell pipe
    - 'msfvenom\s+-p\s+'                                      # payload generation on the box
  spare_root_image: true

outputs:
  file:
    path: /var/log/process-watcher/events.jsonl
