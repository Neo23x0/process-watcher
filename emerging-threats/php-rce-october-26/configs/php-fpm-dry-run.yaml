# PHP-FPM: observation plus a DRY RUN of narrow response rules. Start here before any real kill rule.
#
# Every decision is written to the log (response.kill_requested / response.kill_result with outcome
# dry_run), no signal is sent. Review what the rules would have hit in your own traffic first: PHP
# applications legitimately start mailers, image converters, PDF tools and sometimes a shell.
#
# The rules apply to the descendants of the php-fpm master only, never to the master itself. They name
# shells and interpreters by their exact executable name: "sh" is a symlink to dash on Debian and Ubuntu,
# python3 is python3.13 or similar, php is php8.4. None of these names matches php-fpm8.4, so the pool
# workers are not hit. spare_root_image: true is the safety net: a descendant that runs the same
# executable as its root (a worker, a master that re-executed itself on reload) is never a target.
#
# The netcat and socat family are symlinks or alternatives on most distributions, so the plain command
# name is often not what gets executed: verified with the real agent against Debian 13 (nc -> nc.openbsd,
# socat -> socat1, telnet -> inetutils-telnet) and by executable path against Rocky 9 (nc -> ncat, socat
# and telnet unversioned); see emerging-threats/php-rce-october-26/guide.md. Add names you find on your own distribution the same way:
# the "Read-only discovery" commands in emerging-threats/php-rce-october-26/guide.md section 2 work for any executable, not only PHP's.
config_version: 1
watch:
  image_contains: ["php-fpm"]

capture:
  argv: true
  argv_max_bytes: 16383
  argv_max_args: 64

kill:
  enabled: true
  dry_run: true               # nothing is signalled
  fields: ["image"]
  regex:
    - '^(sh|dash|bash|zsh|ksh|ash)$'                         # a shell started by a PHP worker
    - '^python[0-9.]*$'                                      # python3, python3.13
    - '^(perl|ruby[0-9.]*)$'                                 # perl; ruby3.3 (Debian/Ubuntu), ruby (RHEL)
    - '^(nc|nc\.openbsd|nc\.traditional|ncat|socat[0-9]*|telnet|inetutils-telnet)$'
    - '^php[0-9.]*$'                                         # a PHP CLI interpreter (php, php8.4), not php-fpm8.4
  spare_root_image: true

outputs:
  file:
    path: /var/log/process-watcher/events.jsonl
