# PHP-FPM behind NGINX or Apache (fastcgi_pass, proxy_fcgi): observation only.
#
# PHP does not run inside nginx or apache2 here: it runs in the workers of a separate php-fpm service,
# children of the php-fpm master. A watch on the web server alone does not see anything PHP starts.
# The executable is php-fpm on the official images and php-fpm8.4 (versioned) on Debian and Ubuntu;
# "php-fpm" matches both, several PHP versions and all pools. With a remote FastCGI backend, run the
# agent on the backend host.
#
# One-line equivalent:
#   sudo process-watcher --watch-image-contains php-fpm --capture-argv=true \
#     --capture-argv-max-bytes 16383 --capture-argv-max-args 64
config_version: 1
watch:
  image_contains: ["php-fpm"]

capture:
  argv: true                  # the command lines are the evidence: sh -c -- <command>, python3 -c <code>, ...
  argv_max_bytes: 16383       # default 4096: a longer inline command is cut and reported as incomplete
  argv_max_args: 64           # default 32

outputs:
  file:
    path: /var/log/process-watcher/events.jsonl
