<!-- header: title, tagline, requirements -->
<text x="20" y="46" class="h1" xml:space="preserve"><tspan fill="#ff2794">PROCESS-WATCHER</tspan><tspan fill="#7596a3">  /  </tspan><tspan fill="#29fbf5">HOW IT WORKS</tspan></text>
<text x="20" y="74" class="tag">Follow a service. See what it starts. React to what you name.</text>
<text x="940" y="40" class="req" text-anchor="end">Linux 5.15+ with BTF  ·  amd64  ·  arm64</text>
<text x="940" y="58" class="req" text-anchor="end">one static binary  ·  needs root</text>
<rect x="20" y="91" width="920" height="2" fill="url(#gDiv)"/>
<!-- panel 1, WATCH: the substring flag and the process tree (sshd and cron are not watched) -->
<path d="M34,116 L284,116 L284,510 L270,524 L20,524 L20,130 Z" fill="#04181f" stroke="#15434f" stroke-width="1.25"/>
<rect x="36" y="132" width="22" height="22" rx="4" fill="#29fbf5"/>
<text x="47.0" y="147.6" class="bdg" text-anchor="middle">1</text>
<text x="68" y="148.5" class="lbl">WATCH</text>
<text x="36" y="182" class="ttl">Pick a service by name</text>
<text x="36" y="204" class="bd">Any program whose name contains</text>
<text x="36" y="220" class="bd">your text is a watched root.</text>
<text x="36" y="236" class="bd">All its children are followed.</text>
<rect x="36" y="250" width="232" height="28" rx="5" fill="#031016" stroke="#1a5666" stroke-width="1.2"/>
<text x="46" y="268.2" class="mn" xml:space="preserve"><tspan fill="#5fb9c4">--watch-image-contains </tspan><tspan fill="#eaf6f9">php-fpm</tspan></text>
<rect x="36" y="306" width="54" height="24" rx="5" fill="none" stroke="#1d3d48" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="63.0" y="322.5" class="pill" text-anchor="middle" style="fill:#56737f;font-weight:400;">sshd</text>
<text x="102" y="322" class="mns">ignored</text>
<rect x="36" y="334" width="77" height="24" rx="5" fill="#29fbf5" fill-opacity=".14" stroke="#29fbf5" stroke-width="1.6"/>
<text x="74.5" y="350.5" class="pill" text-anchor="middle" style="fill:#29fbf5;">php-fpm</text>
<text x="125" y="350" class="mns" style="fill:#29fbf5;">watched root</text>
<rect x="58" y="362" width="46" height="24" rx="5" fill="#29fbf5" fill-opacity=".05" stroke="#2c7480" stroke-width="1.3"/>
<text x="81.0" y="378.5" class="pill" text-anchor="middle">sh</text>
<text x="116" y="378" class="mns">child</text>
<rect x="80" y="390" width="54" height="24" rx="5" fill="#29fbf5" fill-opacity=".05" stroke="#2c7480" stroke-width="1.3"/>
<text x="107.0" y="406.5" class="pill" text-anchor="middle">curl</text>
<text x="146" y="406" class="mns">grandchild</text>
<rect x="80" y="418" width="54" height="24" rx="5" fill="#ff2794" fill-opacity=".14" stroke="#ff2794" stroke-width="1.6"/>
<text x="107.0" y="434.5" class="pill" text-anchor="middle" style="fill:#ff5cae;">bash</text>
<text x="146" y="434" class="mns" style="fill:#ff5cae;">reverse shell</text>
<rect x="36" y="446" width="54" height="24" rx="5" fill="none" stroke="#1d3d48" stroke-width="1.2" stroke-dasharray="3 3"/>
