<path d="M69,430 H80" fill="none" stroke="#2c7480" stroke-width="1.5"/>
<circle cx="251" cy="430" r="9" fill="#001216" stroke="#ff2794" stroke-width="1.6"/>
<path d="M247.4,426.4 L254.6,433.6 M254.6,426.4 L247.4,433.6" stroke="#ff2794" stroke-width="2" stroke-linecap="round"/>
<text x="36" y="496" class="smm">Children stay tracked through exec,</text>
<text x="36" y="512" class="smm">double forks and reparenting.</text>
