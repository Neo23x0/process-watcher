</g>
<text x="420" y="146" class="lbls">process-watcher</text>
<text x="420" y="164" class="smm">eBPF in the kernel, no polling</text>
<rect x="360" y="188" width="240" height="146" rx="7" fill="#072129" stroke="#15434f" stroke-width="1.2"/>
<rect x="372" y="200" width="20" height="20" rx="4" fill="#29fbf5"/>
<text x="382.0" y="214.6" class="bdg" text-anchor="middle">2</text>
<text x="400" y="215" class="lbls">OBSERVE</text>
<line x1="394" y1="250" x2="566" y2="250" stroke="#2c7480" stroke-width="2"/>
<circle cx="394" cy="250" r="6" fill="#001216" stroke="#29fbf5" stroke-width="2.2"/>
<text x="394" y="277" class="bd" text-anchor="middle">start</text>
<text x="394" y="293" class="mns" text-anchor="middle">fork</text>
<circle cx="480" cy="250" r="6" fill="#001216" stroke="#29fbf5" stroke-width="2.2"/>
<text x="480" y="277" class="bd" text-anchor="middle">new program</text>
<text x="480" y="293" class="mns" text-anchor="middle">exec</text>
<circle cx="566" cy="250" r="6" fill="#001216" stroke="#29fbf5" stroke-width="2.2"/>
<text x="566" y="277" class="bd" text-anchor="middle">exit</text>
<text x="566" y="293" class="mns" text-anchor="middle">exit</text>
<text x="374" y="316" class="sm">Short-lived processes included.</text>
<rect x="360" y="346" width="240" height="168" rx="7" fill="#072129" stroke="#7a1d52" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="372" y="358" width="20" height="20" rx="4" fill="#ff2794"/>
<text x="382.0" y="372.6" class="bdg" text-anchor="middle">4</text>
<text x="400" y="373" class="lbls" style="fill:#ff2794;">REACT</text>
<text x="588" y="372" class="mns" text-anchor="end">optional</text>
<text x="374" y="400" class="ttl2">Kill rules</text>
<text x="374" y="416" class="sm">your detection patterns, e.g.:</text>
<text x="374" y="438" class="mnb" xml:space="preserve"><tspan fill="#7596a3">strings </tspan><tspan fill="#eaf6f9">ncat</tspan></text>
<text x="374" y="456" class="mnb" xml:space="preserve"><tspan fill="#7596a3">regex   </tspan><tspan fill="#eaf6f9">^bash$</tspan></text>
<text x="374" y="474" class="smm">on program name, path or args</text>
<rect x="374" y="484" width="62" height="20" rx="4" fill="#ff2794"/>
<text x="405" y="498" class="chip" text-anchor="middle">SIGKILL</text>
<text x="446" y="498" class="sm">to a matching child</text>
<!-- panel 3, RECORD AND SEND: local log (always) and optional TCP, UDP, webhook -->
<path d="M690,116 L940,116 L940,510 L926,524 L676,524 L676,130 Z" fill="#04181f" stroke="#15434f" stroke-width="1.25"/>
<rect x="692" y="132" width="22" height="22" rx="4" fill="#29fbf5"/>
<text x="703.0" y="147.6" class="bdg" text-anchor="middle">3</text>
<text x="724" y="148.5" class="lbl">RECORD &amp; SEND</text>
<rect x="688" y="164" width="240" height="108" rx="7" fill="#072129" stroke="#29fbf5" stroke-width="1.4"/>
<path d="M702,178 L716,178 L724,186 L724,206 L702,206 Z" fill="none" stroke="#29fbf5" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M716,178 L716,186 L724,186" fill="none" stroke="#29fbf5" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="707" y1="190" x2="719" y2="190" stroke="#29fbf5" stroke-width="1.4" stroke-opacity=".8"/>
<line x1="707" y1="195" x2="719" y2="195" stroke="#29fbf5" stroke-width="1.4" stroke-opacity=".8"/>
<line x1="707" y1="200" x2="714" y2="200" stroke="#29fbf5" stroke-width="1.4" stroke-opacity=".8"/>
<text x="736" y="194" class="ttl2">Local log</text>
<rect x="846" y="178" width="70" height="18" rx="4" fill="#29fbf5"/>
<text x="881" y="190.6" class="chip" text-anchor="middle">ALWAYS ON</text>
<text x="736" y="214" class="mn">process-watcher.jsonl</text>
<text x="702" y="240" class="sm">One JSON event per line.</text>
<text x="702" y="256" class="sm">Kill decisions are logged here too.</text>
<rect x="688" y="284" width="240" height="230" rx="7" fill="#05202a" stroke="#2a8791" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="702" y="308" class="mns">OPTIONAL TARGETS</text>
<text x="702" y="326" class="sm">SIEM, log pipeline, own receiver</text>
<rect x="702" y="346" width="46" height="30" rx="5" fill="none" stroke="#29fbf5" stroke-width="1.5"/>
<text x="725" y="365.5" class="mnb" text-anchor="middle">TCP</text>
<text x="756" y="359" class="ttl2">TCP</text>
<text x="756" y="375" class="sm">JSON lines, optional TLS</text>
<rect x="702" y="402" width="46" height="30" rx="5" fill="none" stroke="#29fbf5" stroke-width="1.5"/>
<text x="725" y="421.5" class="mnb" text-anchor="middle">UDP</text>
<text x="756" y="415" class="ttl2">UDP</text>
<text x="756" y="431" class="sm">one event per datagram</text>
<rect x="702" y="458" width="46" height="30" rx="5" fill="none" stroke="#29fbf5" stroke-width="1.5"/>
<text x="725" y="477.5" class="mnb" text-anchor="middle">HTTP</text>
<text x="756" y="471" class="ttl2">Webhook</text>
<text x="756" y="487" class="sm">HTTP POST per event</text>
<!-- arrows: events in (cyan), outputs (solid and dashed), kill path (pink) -->
<line x1="284" y1="261" x2="359" y2="261" stroke="#29fbf5" stroke-width="2" marker-end="url(#aC)"/>
<text x="316.0" y="253" class="mns" text-anchor="middle">events</text>
<line x1="600" y1="261" x2="644" y2="261" stroke="#29fbf5" stroke-width="2"/>
<line x1="644" y1="218" x2="644" y2="399" stroke="#29fbf5" stroke-width="2" stroke-dasharray="5 4"/>
