<svg xmlns="http://www.w3.org/2000/svg" width="960" height="588" viewBox="0 0 960 588" role="img" aria-labelledby="t d">
<title id="t">How process-watcher works</title>
<desc id="d">process-watcher follows every program whose file name contains a text you choose, for example php-fpm, and every process they start. It sees each start, program change and exit in the kernel, writes every event to a local JSON log and can forward it to a TCP, UDP or webhook target. Optional kill rules, your detection patterns, send SIGKILL to matching child processes.</desc>
<defs>
