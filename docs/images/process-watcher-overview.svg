<line x1="644" y1="218" x2="687" y2="218" stroke="#29fbf5" stroke-width="2" marker-end="url(#aC)"/>
<line x1="644" y1="399" x2="687" y2="399" stroke="#29fbf5" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aC)"/>
<circle cx="644" cy="261" r="3.4" fill="#29fbf5"/>
<line x1="359" y1="430" x2="268" y2="430" stroke="#ff2794" stroke-width="2" marker-end="url(#aP)"/>
<circle cx="360" cy="430" r="3.4" fill="#ff2794"/>
<text x="316.0" y="422" class="mns" text-anchor="middle" style="fill:#ff5cae;font-weight:700;">SIGKILL</text>
<!-- footer: legend and the reaction note -->
<line x1="20" y1="544" x2="940" y2="544" stroke="#0f3340" stroke-width="1"/>
<line x1="20" y1="562" x2="52" y2="562" stroke="#29fbf5" stroke-width="2"/>
<text x="60" y="566" class="smm">always on</text>
<line x1="138" y1="562" x2="170" y2="562" stroke="#29fbf5" stroke-width="2" stroke-dasharray="5 4"/>
<text x="178" y="566" class="smm">optional</text>
<line x1="246" y1="562" x2="278" y2="562" stroke="#ff2794" stroke-width="2"/>
<text x="286" y="566" class="smm">kill path</text>
<text x="940" y="566" class="smm" text-anchor="end">Reaction, not prevention: a kill follows the detection.</text>
</svg>
